[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clm-aws-decision-support"
version = "0.1.0"
description = "Multi-provider model-selection decision support"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "ag-ui-protocol>=0.1.10",
    "fastapi>=0.110",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.27",
]
auth = [
    "supabase>=2.0",
]
bedrock = [
    "boto3>=1.34",
]
azure = [
    "openai>=1.40",
    "azure-identity>=1.17",
]
production = [
    "ag-ui-protocol>=0.1.10",
    "fastapi>=0.110",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.27",
    "supabase>=2.0",
    "boto3>=1.34",
    "openai>=1.40",
    "azure-identity>=1.17",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
